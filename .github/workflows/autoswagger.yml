name: API security scan (Autoswagger)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  autoswagger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: compose.test.yml

    steps:
      - name: Checkout API
        uses: actions/checkout@v4

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:5000/openapi/v1.json > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 3
          done
          echo "API did not start"
          docker compose logs api
          exit 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Autoswagger
        run: |
          git clone --depth 1 https://github.com/intruder-io/autoswagger.git
          cd autoswagger
          pip install -r requirements.txt

      - name: Run Autoswagger
        run: |
          python autoswagger/autoswagger.py \
            http://localhost:5000/openapi/v1.json \
            -risk -rate 20 -product > autoswagger-results.json

      - name: Collect logs
        if: always()
        run: docker compose logs > compose.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoswagger-results
          path: |
            autoswagger-results.json
            compose.log

      - name: Fail if findings
        run: |
          COUNT=$(jq 'length' autoswagger-results.json)
          echo "Findings: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            jq . autoswagger-results.json
            exit 1
          fi

      - name: Tear down
        if: always()
        run: docker compose down -v
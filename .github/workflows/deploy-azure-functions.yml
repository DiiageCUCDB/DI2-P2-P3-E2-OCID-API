name: Deploy to Azure Functions (Flex Consumption)

# Deploys the API to an Azure Functions Flex Consumption app on every new
# release tag (v1.2.3). The ASP.NET Core app runs as a Functions *custom handler*,
# see deploy/azure-functions/README.md for the one-time Azure setup.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Never run two deployments at the same time, and never cancel one in progress
concurrency:
  group: deploy-azure-functions
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  API_PROJECT: OCID.Api/OCID.Api.csproj
  RUNTIME_ID: linux-x64

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      id-token: write # OIDC login to Azure
      contents: read
    env:
      AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "${AZURE_FUNCTIONAPP_NAME}" ]; then
            echo "::error::Repository variable AZURE_FUNCTIONAPP_NAME is not set."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-manual" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: |
          dotnet publish "${API_PROJECT}" \
            -c Release \
            -r "${RUNTIME_ID}" \
            --self-contained true \
            -p:Version="${{ steps.version.outputs.value }}" \
            -o "${RUNNER_TEMP}/publish"

      - name: Add Azure Functions host files
        run: |
          cp deploy/azure-functions/host.json "${RUNNER_TEMP}/publish/host.json"
          cp -r deploy/azure-functions/api "${RUNNER_TEMP}/publish/api"

      # Zipped here (not via upload-artifact) so the executable bit survives
      - name: Package
        run: |
          chmod +x "${RUNNER_TEMP}/publish/OCID.Api"
          test -f "${RUNNER_TEMP}/publish/host.json"
          test -f "${RUNNER_TEMP}/publish/api/function.json"
          (cd "${RUNNER_TEMP}/publish" && zip -qr "${RUNNER_TEMP}/functionapp.zip" .)
          ls -lh "${RUNNER_TEMP}/functionapp.zip"

      - name: Login to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        id: deploy
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ runner.temp }}/functionapp.zip

      - name: Smoke test /health
        env:
          APP_URL: ${{ steps.deploy.outputs.app-url }}
        run: |
          if [ -z "${APP_URL}" ]; then
            echo "::warning::The deploy action returned no app-url, skipping the smoke test."
            exit 0
          fi
          # A cold start plus the EF Core migrations at startup can take a while
          curl -fsS --retry 10 --retry-delay 15 --retry-all-errors --max-time 60 "${APP_URL%/}/health"
